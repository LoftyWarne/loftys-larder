# Fly.io app config for Lofty's Larder.
#
# Per DEC-63 / DEC-64: single region `lhr`, Fly auto-stop, no always-on machine.

app = "loftys-larder-prod"
primary_region = "lhr"

[build]
  # Multi-stage Dockerfile in the repo root.
  dockerfile = "Dockerfile"

# Migrations run as a Fly release command on every deploy (DEC-40, DEC-65).
# There is no `flyctl deploy --release-command` flag; this is the only place
# Fly reads it. The release machine boots the runtime image and runs the
# bundled migrate entrypoint (drizzle-orm's programmatic migrator, DEC-61)
# before the new version goes live — prod never needs drizzle-kit. The
# reference seed runs right after (idempotent, `ON CONFLICT DO NOTHING`) and
# only if migration succeeds. Fly execs release_command without a shell, so the
# `sh -c` wrapper is required for `&&` — without it the seed args are passed to
# migrate.js and silently ignored.
[deploy]
  release_command = "sh -c 'node /app/migrate.js && node /app/seed-reference.js'"

# Recipe Import reader (DEC-104, DEC-109) and health scorer (DEC-112). Not
# secrets; ANTHROPIC_API_KEY is a Fly secret and must be set before a deploy
# that selects `anthropic` (docs/secrets-checklist.md). Changing a model or
# effort needs no code change. HEALTH_SCORE_SINCE moves to the deploy date
# with any change of scoring model or prompt, so older scores are rescored.
[env]
  RECIPE_IMPORT_ADAPTER = "anthropic"
  RECIPE_IMPORT_MODEL = "claude-opus-5-5"
  RECIPE_IMPORT_EFFORT = "medium"
  HEALTH_SCORE_ADAPTER = "anthropic"
  HEALTH_SCORE_MODEL = "claude-opus-5-5"
  HEALTH_SCORE_EFFORT = "low"
  HEALTH_SCORE_SINCE = "2026-10-07"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

# Machine-level TCP liveness probe.
#
# FEAT-46 introduces `/api/health`; at that point swap this for an HTTP check
# (or keep both). Declaring an HTTP check that points at a non-existent route
# now would mark every machine unhealthy through FEAT-06 deployment.
[checks]
  [checks.tcp_alive]
    type = "tcp"
    port = 3000
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
